[package]
name = "criteria-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", optional = true }
serde_yaml = { version = "0.9.34", optional = true }
thiserror = "2.0.21"
toml = { version = "1.2.1", optional = true }

[features]
json = ["dep:serde_json"]
yaml = ["dep:serde_yaml"]
toml = ["dep:toml"]
